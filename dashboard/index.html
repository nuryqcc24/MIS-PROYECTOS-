<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semáforo en vivo</title>
<style>
  :root {
    --fondo: #f3f4f6;
    --tarjeta: #ffffff;
    --texto: #111827;
    --suave: #6b7280;
    --borde: #e5e7eb;
    --caja: #1f2937;
    --apagada: #374151;
    --rojo: #ef4444;
    --amarillo: #facc15;
    --verde: #22c55e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #0b1120;
      --tarjeta: #111827;
      --texto: #f3f4f6;
      --suave: #9ca3af;
      --borde: #1f2937;
      --caja: #030712;
      --apagada: #1f2937;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fondo);
    color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .contenedor {
    display: flex;
    gap: 32px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 1000px;
    width: 100%;
  }
  /* --- Escena: hormiga + semáforo con poste --- */
  .escena { display: flex; align-items: flex-end; gap: 4px; }
  .torre { display: flex; flex-direction: column; align-items: center; }
  .poste {
    width: 26px; height: 150px;
    background: linear-gradient(90deg, #4b5563, #9ca3af 45%, #4b5563);
  }
  .base {
    width: 130px; height: 34px; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 35%, #6b7280, #374151 70%);
    margin-top: -10px;
  }
  .hormiga { width: 260px; height: auto; margin-bottom: 40px; margin-right: -20px; overflow: visible; }
  .hormiga .hoja { fill: var(--hoja, #9ca3af); transition: fill .15s; }
  .hormiga .vena { stroke: rgba(0, 0, 0, .25); stroke-width: 2.5; fill: none; stroke-linecap: round; }
  .hormiga .cuerpo { fill: #e2711d; stroke: #7a3608; stroke-width: 3; }
  .hormiga .oscuro { fill: #b4540f; }
  .hormiga .linea { stroke: #7a3608; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .hormiga .tallo { stroke: #4d7c0f; stroke-width: 5; stroke-linecap: round; }
  .meneo { transform-origin: 150px 160px; animation: menear 2.4s ease-in-out infinite; }
  @keyframes menear { 50% { transform: rotate(-4deg); } }
  @media (prefers-reduced-motion: reduce) { .meneo { animation: none; } }
  @media (max-width: 560px) { .hormiga { width: 130px; } }

  /* --- Semáforo dibujado --- */
  .semaforo {
    background: var(--caja);
    border-radius: 28px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, .25);
  }
  .luz {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: var(--apagada);
    transition: background .15s, box-shadow .15s;
  }
  .luz.rojo.on     { background: var(--rojo);     box-shadow: 0 0 40px var(--rojo); }
  .luz.amarillo.on { background: var(--amarillo); box-shadow: 0 0 40px var(--amarillo); }
  .luz.verde.on    { background: var(--verde);    box-shadow: 0 0 40px var(--verde); }
  /* --- Panel de información --- */
  .panel {
    flex: 1 1 320px;
    background: var(--tarjeta);
    border: 1px solid var(--borde);
    border-radius: 16px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .conexion { display: flex; align-items: center; gap: 8px; color: var(--suave); font-size: 14px; }
  .punto { width: 10px; height: 10px; border-radius: 50%; background: var(--rojo); }
  .punto.ok { background: var(--verde); }
  .etiqueta { color: var(--suave); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
  .fase { font-size: 40px; font-weight: 700; margin-top: 4px; }
  .barra { height: 10px; background: var(--borde); border-radius: 99px; overflow: hidden; margin-top: 10px; }
  .relleno { height: 100%; width: 0; background: var(--suave); transition: width .15s linear; }
  .restante { font-variant-numeric: tabular-nums; color: var(--suave); margin-top: 6px; font-size: 14px; }
  .peatones {
    font-size: 22px; font-weight: 600; padding: 12px 16px; border-radius: 12px; background: var(--fondo);
    display: flex; align-items: center; gap: 12px;
  }
  .peatones svg { width: 32px; height: 32px; flex: none; }
  .datos { display: flex; gap: 24px; }
  .dato b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  ul { list-style: none; padding: 0; margin: 6px 0 0; font-size: 14px; color: var(--suave); }
  li { padding: 3px 0; display: flex; gap: 10px; font-variant-numeric: tabular-nums; }
  li span:last-child { color: var(--texto); }
</style>
</head>
<body>
<main class="contenedor">
  <div class="escena">
    <!-- Hormiga con su hoja: la hoja toma el color de la luz encendida -->
    <svg class="hormiga" viewBox="0 0 220 290" aria-hidden="true">
      <g class="meneo">
        <!-- tallo y hoja (paraguas) -->
        <line class="tallo" x1="150" y1="160" x2="95" y2="45"/>
        <path class="hoja" d="M8 92 C 30 20, 150 -10, 200 40 C 175 52, 140 50, 112 62 C 80 76, 40 70, 8 92 Z"/>
        <path class="vena" d="M18 86 C 70 50, 140 30, 192 42"/>
        <path class="vena" d="M60 64 L 52 42 M95 52 L 92 26 M130 42 L 134 18 M165 40 L 172 22"/>
        <path class="vena" d="M60 64 L 70 74 M95 52 L 108 66 M130 42 L 146 52"/>
        <!-- brazos sujetando el tallo -->
        <path class="linea" d="M118 168 C 130 160, 140 152, 146 150"/>
        <path class="linea" d="M112 176 C 128 178, 144 172, 152 164"/>
        <circle class="cuerpo" cx="148" cy="150" r="6"/>
        <circle class="cuerpo" cx="153" cy="165" r="6"/>
      </g>
      <!-- patas -->
      <path class="linea" d="M100 192 L 84 232 L 70 280 L 56 282"/>
      <path class="linea" d="M112 194 L 116 236 L 108 282 L 94 284"/>
      <path class="linea" d="M68 218 L 40 246 L 30 276"/>
      <!-- abdomen con rayas -->
      <ellipse class="cuerpo" cx="62" cy="200" rx="36" ry="28"/>
      <path class="oscuro" d="M44 177 C 52 190, 52 212, 42 224 L 52 226 C 62 212, 62 190, 54 175 Z"/>
      <path class="oscuro" d="M68 172 C 76 188, 76 214, 68 228 L 78 226 C 86 212, 86 190, 78 174 Z"/>
      <!-- tórax -->
      <ellipse class="cuerpo" cx="108" cy="178" rx="16" ry="20"/>
      <!-- antenas -->
      <path class="linea" d="M120 96 C 112 70, 96 62, 86 66"/>
      <path class="linea" d="M140 94 C 146 66, 164 58, 174 64"/>
      <circle class="oscuro" cx="85" cy="66" r="6"/>
      <circle class="oscuro" cx="175" cy="64" r="6"/>
      <!-- cabeza -->
      <circle class="cuerpo" cx="130" cy="124" r="32"/>
      <ellipse cx="120" cy="116" rx="9" ry="12" fill="#fff" stroke="#7a3608" stroke-width="2"/>
      <ellipse cx="142" cy="114" rx="9" ry="12" fill="#fff" stroke="#7a3608" stroke-width="2"/>
      <circle cx="123" cy="119" r="4.5" fill="#1f2937"/>
      <circle cx="145" cy="117" r="4.5" fill="#1f2937"/>
      <circle cx="124.5" cy="117" r="1.5" fill="#fff"/>
      <circle cx="146.5" cy="115" r="1.5" fill="#fff"/>
      <path d="M118 136 C 126 150, 146 150, 152 132 Z" fill="#7a1d0d"/>
      <path d="M128 144 C 132 140, 140 140, 144 143 C 140 148, 132 148, 128 144 Z" fill="#f87171"/>
    </svg>

    <div class="torre">
      <div class="semaforo" aria-label="Semáforo">
        <div class="luz rojo" id="luz-ROJO"></div>
        <div class="luz amarillo" id="luz-AMARILLO"></div>
        <div class="luz verde" id="luz-VERDE"></div>
      </div>
      <div class="poste"></div>
      <div class="base"></div>
    </div>
  </div>

  <section class="panel">
    <div class="conexion"><span class="punto" id="punto"></span><span id="mensaje">Conectando…</span></div>

    <div>
      <div class="etiqueta">Fase actual</div>
      <div class="fase" id="fase">—</div>
      <div class="barra"><div class="relleno" id="relleno"></div></div>
      <div class="restante" id="restante"></div>
    </div>

    <div class="peatones" id="peatones">—</div>

    <div class="datos">
      <div class="dato"><span class="etiqueta">Ciclos</span><b id="ciclos">0</b></div>
      <div class="dato"><span class="etiqueta">Luz encendida</span><b id="luz">—</b></div>
    </div>

    <div>
      <div class="etiqueta">Últimos cambios</div>
      <ul id="historial"></ul>
    </div>
  </section>
</main>

<script>
  const COLORES = { ROJO: "var(--rojo)", AMARILLO: "var(--amarillo)", VERDE: "var(--verde)" };
  const NOMBRES = { ROJO: "Rojo", AMARILLO: "Amarillo", VERDE: "Verde", APAGADO: "Ninguna" };
  const $ = (id) => document.getElementById(id);

  // Íconos (SVG de trazo, toman el color del texto)
  const ICONO_CAMINAR = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="13" cy="4" r="2"/><path d="M7 21l3-4"/><path d="M16 21l-2-4-3-3 1-6"/><path d="M6 12l2-3 4-1 3 3 3 1"/></svg>`;
  const ICONO_ALTO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/>
    <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>`;

  async function actualizar() {
    try {
      const e = await (await fetch("/api/estado")).json();

      $("punto").classList.toggle("ok", e.conectado);
      $("mensaje").textContent = e.mensaje;

      for (const color of ["ROJO", "AMARILLO", "VERDE"]) {
        $("luz-" + color).classList.toggle("on", e.conectado && e.luz === color);
      }
      $("luz").textContent = NOMBRES[e.luz] || e.luz;
      // la hoja de la hormiga toma el color de la luz encendida (gris si no hay)
      document.documentElement.style.setProperty("--hoja", (e.conectado && COLORES[e.luz]) || "#9ca3af");

      if (e.fase) {
        $("fase").textContent = NOMBRES[e.fase] || e.fase;
        $("fase").style.color = COLORES[e.fase] || "";
        const avance = e.duracion ? 100 * (1 - e.restante / e.duracion) : 0;
        $("relleno").style.width = avance + "%";
        $("relleno").style.background = COLORES[e.fase] || "";
        $("restante").textContent = `Quedan ${e.restante.toFixed(1)} s de ${e.duracion.toFixed(0)} s`;
        const cruzan = e.fase === "ROJO";
        $("peatones").innerHTML = cruzan
          ? `${ICONO_CAMINAR}<span>Peatones: pueden cruzar</span>`
          : `${ICONO_ALTO}<span>Peatones: esperen</span>`;
        $("peatones").style.color = cruzan ? "var(--verde)" : "var(--rojo)";
      } else {
        $("fase").textContent = "Esperando al ESP32…";
      }

      $("ciclos").textContent = e.ciclos;
      $("historial").innerHTML = e.historial
        .map(([hora, fase]) => `<li><span>${hora}</span><span>${NOMBRES[fase] || fase}</span></li>`)
        .join("");
    } catch {
      $("punto").classList.remove("ok");
      $("mensaje").textContent = "El servidor del dashboard está cerrado";
    }
  }

  actualizar();
  setInterval(actualizar, 150);
</script>
</body>
</html>
