<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semáforo en vivo</title>
<style>
  :root {
    --fondo: #f3f4f6;
    --tarjeta: #ffffff;
    --texto: #111827;
    --suave: #6b7280;
    --borde: #e5e7eb;
    --caja: #1f2937;
    --apagada: #374151;
    --rojo: #ef4444;
    --amarillo: #facc15;
    --verde: #22c55e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #0b1120;
      --tarjeta: #111827;
      --texto: #f3f4f6;
      --suave: #9ca3af;
      --borde: #1f2937;
      --caja: #030712;
      --apagada: #1f2937;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fondo);
    color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .contenedor {
    display: flex;
    gap: 32px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 1000px;
    width: 100%;
  }
  /* --- Semáforo con poste --- */
  .escena { display: flex; align-items: flex-end; gap: 4px; }
  .torre { display: flex; flex-direction: column; align-items: center; }
  .poste {
    width: 26px; height: 150px;
    background: linear-gradient(90deg, #4b5563, #9ca3af 45%, #4b5563);
  }
  .base {
    width: 130px; height: 34px; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 35%, #6b7280, #374151 70%);
    margin-top: -10px;
  }

  /* --- Semáforo dibujado --- */
  .semaforo {
    background: var(--caja);
    border-radius: 28px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, .25);
  }
  .luz {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: var(--apagada);
    transition: background .15s, box-shadow .15s;
  }
  .luz.rojo.on     { background: var(--rojo);     box-shadow: 0 0 40px var(--rojo); }
  .luz.amarillo.on { background: var(--amarillo); box-shadow: 0 0 40px var(--amarillo); }
  .luz.verde.on    { background: var(--verde);    box-shadow: 0 0 40px var(--verde); }
  /* --- Panel de información --- */
  .panel {
    flex: 1 1 320px;
    background: var(--tarjeta);
    border: 1px solid var(--borde);
    border-radius: 16px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .conexion { display: flex; align-items: center; gap: 8px; color: var(--suave); font-size: 14px; }
  .punto { width: 10px; height: 10px; border-radius: 50%; background: var(--rojo); }
  .punto.ok { background: var(--verde); }
  .etiqueta { color: var(--suave); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
  .fase { font-size: 40px; font-weight: 700; margin-top: 4px; }
  .barra { height: 10px; background: var(--borde); border-radius: 99px; overflow: hidden; margin-top: 10px; }
  .relleno { height: 100%; width: 0; background: var(--suave); transition: width .15s linear; }
  .restante { font-variant-numeric: tabular-nums; color: var(--suave); margin-top: 6px; font-size: 14px; }
  .peatones {
    font-size: 22px; font-weight: 600; padding: 12px 16px; border-radius: 12px; background: var(--fondo);
    display: flex; align-items: center; gap: 12px;
  }
  .peatones svg { width: 32px; height: 32px; flex: none; }
  .datos { display: flex; gap: 24px; }
  .dato b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  ul { list-style: none; padding: 0; margin: 6px 0 0; font-size: 14px; color: var(--suave); }
  li { padding: 3px 0; display: flex; gap: 10px; font-variant-numeric: tabular-nums; }
  li span:last-child { color: var(--texto); }
</style>
</head>
<body>
<main class="contenedor">
  <div class="escena">
    <div class="torre">
      <div class="semaforo" aria-label="Semáforo">
        <div class="luz rojo" id="luz-ROJO"></div>
        <div class="luz amarillo" id="luz-AMARILLO"></div>
        <div class="luz verde" id="luz-VERDE"></div>
      </div>
      <div class="poste"></div>
      <div class="base"></div>
    </div>
  </div>

  <section class="panel">
    <div class="conexion"><span class="punto" id="punto"></span><span id="mensaje">Conectando…</span></div>

    <div>
      <div class="etiqueta">Fase actual</div>
      <div class="fase" id="fase">—</div>
      <div class="barra"><div class="relleno" id="relleno"></div></div>
      <div class="restante" id="restante"></div>
    </div>

    <div class="peatones" id="peatones">—</div>

    <div class="datos">
      <div class="dato"><span class="etiqueta">Ciclos</span><b id="ciclos">0</b></div>
      <div class="dato"><span class="etiqueta">Luz encendida</span><b id="luz">—</b></div>
    </div>

    <div>
      <div class="etiqueta">Últimos cambios</div>
      <ul id="historial"></ul>
    </div>
  </section>
</main>

<script>
  const COLORES = { ROJO: "var(--rojo)", AMARILLO: "var(--amarillo)", VERDE: "var(--verde)" };
  const NOMBRES = { ROJO: "Rojo", AMARILLO: "Amarillo", VERDE: "Verde", APAGADO: "Ninguna" };
  const $ = (id) => document.getElementById(id);

  // Íconos (SVG de trazo, toman el color del texto)
  const ICONO_CAMINAR = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="13" cy="4" r="2"/><path d="M7 21l3-4"/><path d="M16 21l-2-4-3-3 1-6"/><path d="M6 12l2-3 4-1 3 3 3 1"/></svg>`;
  const ICONO_ALTO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/>
    <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>`;

  async function actualizar() {
    try {
      const e = await (await fetch("/api/estado")).json();

      $("punto").classList.toggle("ok", e.conectado);
      $("mensaje").textContent = e.mensaje;

      for (const color of ["ROJO", "AMARILLO", "VERDE"]) {
        $("luz-" + color).classList.toggle("on", e.conectado && e.luz === color);
      }
      $("luz").textContent = NOMBRES[e.luz] || e.luz;

      if (e.fase) {
        $("fase").textContent = NOMBRES[e.fase] || e.fase;
        $("fase").style.color = COLORES[e.fase] || "";
        const avance = e.duracion ? 100 * (1 - e.restante / e.duracion) : 0;
        $("relleno").style.width = avance + "%";
        $("relleno").style.background = COLORES[e.fase] || "";
        $("restante").textContent = `Quedan ${e.restante.toFixed(1)} s de ${e.duracion.toFixed(0)} s`;
        const cruzan = e.fase === "ROJO";
        $("peatones").innerHTML = cruzan
          ? `${ICONO_CAMINAR}<span>Peatones: pueden cruzar</span>`
          : `${ICONO_ALTO}<span>Peatones: esperen</span>`;
        $("peatones").style.color = cruzan ? "var(--verde)" : "var(--rojo)";
      } else {
        $("fase").textContent = "Esperando al ESP32…";
      }

      $("ciclos").textContent = e.ciclos;
      $("historial").innerHTML = e.historial
        .map(([hora, fase]) => `<li><span>${hora}</span><span>${NOMBRES[fase] || fase}</span></li>`)
        .join("");
    } catch {
      $("punto").classList.remove("ok");
      $("mensaje").textContent = "El servidor del dashboard está cerrado";
    }
  }

  actualizar();
  setInterval(actualizar, 150);
</script>
</body>
</html>
